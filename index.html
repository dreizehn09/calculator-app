<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金額計算アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<div class="select-buttons">
    <button id="selectAllButton">全選択</button>
    <button id="deselectAllButton">全解除</button>
</div>

<div id="items"></div>

<!-- 合計金額表示を復元 -->
<div id="total" class="total">¥0</div>

<button id="addButton" class="add-button">
    ＋ 金額項目を追加
</button>

<button id="toggleAddButton" class="toggle-add-button">
    項目追加ボタンを表示・非表示
</button>    

</div>

<script src="script.js"></script>
</body>
</html>
